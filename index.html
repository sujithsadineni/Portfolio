      // Set theme before first paint (no flash). Saved choice wins, else OS setting.
      try {
        var t = localStorage.getItem("theme");
      } catch (e) {}
      document.documentElement.dataset.theme =
        t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    </script>
